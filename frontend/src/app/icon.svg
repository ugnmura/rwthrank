<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The grade distribution the site is built around, at 32px: bars rising to the
    middle, then the gap where 4,3 and 4,7 would be if the German scale had
    them, and the failing 5,0 standing alone in red.
  -->
  <rect width="32" height="32" rx="6" fill="#00549f"/>
  <g fill="#ffffff">
    <rect x="5"  y="19" width="4" height="8"  rx="1"/>
    <rect x="10" y="14" width="4" height="13" rx="1"/>
    <rect x="15" y="9"  width="4" height="18" rx="1"/>
    <rect x="20" y="16" width="4" height="11" rx="1"/>
  </g>
  <rect x="26" y="21" width="4" height="6" rx="1" fill="#e30066"/>
</svg>
