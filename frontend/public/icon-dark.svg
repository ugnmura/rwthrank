<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="rwthrank">
  <!--
    Same chart on the dark chip: the tab strip is already dark there, so a solid
    blue square goes muddy. The ground drops to the page colour and the bars take
    the lighter blue the dark theme uses for everything else.
  -->
  <rect width="32" height="32" rx="7" fill="#0c1e30"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#17304a"/>
  <g fill="#5fa8df">
    <rect x="5"  y="18" width="3.5" height="7"  rx="1.75"/>
    <rect x="10" y="13" width="3.5" height="12" rx="1.75"/>
    <rect x="15" y="8"  width="3.5" height="17" rx="1.75"/>
    <rect x="20" y="15" width="3.5" height="10" rx="1.75"/>
  </g>
  <rect x="25.5" y="20" width="3.5" height="5" rx="1.75" fill="#ff4d8d"/>
  <rect x="5" y="26" width="24" height="1" rx="0.5" fill="#5fa8df" opacity="0.3"/>
</svg>
