<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="rwthrank">
  <!--
    The distribution the site is built around: bars rising to the middle, the gap
    where 4,3 and 4,7 would be if the German scale had them, and the failing 5,0
    standing on its own. Light theme — deep RWTH blue with the marks in white.
  -->
  <rect width="32" height="32" rx="7" fill="#00549f"/>
  <g fill="#ffffff">
    <rect x="5"  y="18" width="3.5" height="7"  rx="1.75"/>
    <rect x="10" y="13" width="3.5" height="12" rx="1.75"/>
    <rect x="15" y="8"  width="3.5" height="17" rx="1.75"/>
    <rect x="20" y="15" width="3.5" height="10" rx="1.75"/>
  </g>
  <rect x="25.5" y="20" width="3.5" height="5" rx="1.75" fill="#ff87b4"/>
  <rect x="5" y="26" width="24" height="1" rx="0.5" fill="#ffffff" opacity="0.35"/>
</svg>
