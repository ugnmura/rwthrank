name: deploy

# Only the backend deploys from here. The frontend is a Vercel project and
# releases on its own git integration.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  # GITHUB_TOKEN pushes the image; GHCR needs no separate registry secret.
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # Watchtower on the box watches :latest; the sha tag is what makes a
          # rollback possible without rebuilding.
          tags: |
            ghcr.io/${{ github.repository_owner }}/rwthrank-backend:latest
            ghcr.io/${{ github.repository_owner }}/rwthrank-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
